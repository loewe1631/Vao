name: Windows input lab
on:
  push:
    branches: [codex/windows]
    paths:
      - scripts/windows-input-lab/**
      - .github/workflows/windows-input-lab.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-input-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unicode-entry:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python scripts/check-source.py
      - name: Compile independent x64 input lab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'MSVC installation unavailable' }
          $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvarsall.bat'
          New-Item -ItemType Directory -Force dist/input-lab | Out-Null
          $commands = @(
            ('call "' + $vcvars + '" x64'),
            ('cl /nologo /std:c++17 /permissive- /W4 /WX /EHsc /O2 /MT /utf-8 /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /DVAO_LAB_COMMIT=\"${{ github.sha }}\" scripts/windows-input-lab/input-lab.cpp /Fe:dist/input-lab/vao-input-lab.exe /Fo:dist/input-lab/input-lab.obj /link user32.lib advapi32.lib ole32.lib oleaut32.lib uiautomationcore.lib')
          )
          $commands | Set-Content dist/input-lab/build.cmd -Encoding ascii
          & cmd.exe /d /c dist\input-lab\build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Input lab compilation failed' }
      - name: Verify synthetic cross-process input and identity
        shell: pwsh
        run: |
          & ./dist/input-lab/vao-input-lab.exe --build-info dist/input-lab/build-info.json
          if ($LASTEXITCODE -ne 0) { throw 'Lab identity failed' }
          & ./dist/input-lab/vao-input-lab.exe --self-test dist/input-lab/runner-input-lab.json
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic input lab tests failed' }
          $report = Get-Content dist/input-lab/runner-input-lab.json -Raw | ConvertFrom-Json
          if (!$report.passed -or $report.commit -ne '${{ github.sha }}' -or $report.checks.Count -ne 22) { throw 'Unexpected lab evidence' }
          $required = @('unsupported_value_pattern_is_absent', 'unsupported_text_pattern_is_absent', 'uia_edit_patterns_present', 'uia_capture_restoration_and_exact_receipt', 'delayed_native_focus_restored_before_dispatch', 'uia_requested_only_saved_element_when_native_focus_absent', 'focus_restore_timeout_does_not_dispatch', 'late_different_field_rejected_without_dispatch')
          foreach ($name in $required) {
            if (!($report.checks | Where-Object { $_.name -eq $name -and $_.passed })) { throw "Missing real UIA regression: $name" }
          }
      - name: Verify startup readiness and hotkey failure reports without submitting text
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $PWD 'dist/input-lab/startup-probe'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $binary = Join-Path $PWD 'dist/input-lab/vao-input-lab.exe'
          $first = $null
          $second = $null
          try {
            $first = Start-Process $binary -ArgumentList @('--interactive', ('"' + $directory + '/first"')) -PassThru -RedirectStandardOutput "$directory/first.out" -RedirectStandardError "$directory/first.err"
            $ready = $false
            for ($attempt = 0; $attempt -lt 200; $attempt++) {
              if ($first.HasExited) { throw 'Interactive startup exited before ready' }
              $file = Get-ChildItem "$directory/first/startup-*.json" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($file) {
                try { $ready = (Get-Content $file.FullName -Raw | ConvertFrom-Json).stage -eq 'ready' } catch { $ready = $false }
              }
              if ($ready) { break }
              Start-Sleep -Milliseconds 100
            }
            if (!$ready) { throw 'Startup ready report unavailable' }
            if ((Get-Content "$directory/first.out" -Raw -Encoding utf8) -notmatch '已就绪') { throw 'Visible readiness missing' }
            $second = Start-Process $binary -ArgumentList @('--interactive', ('"' + $directory + '/second"')) -PassThru -RedirectStandardOutput "$directory/second.out" -RedirectStandardError "$directory/second.err"
            if (!$second.WaitForExit(10000) -or $second.ExitCode -ne 1) { throw 'Duplicate lab must fail at hotkey registration' }
            $fatal = Get-ChildItem "$directory/second/fatal-*.json" | Select-Object -First 1 | Get-Content -Raw | ConvertFrom-Json
            if ($fatal.error -ne 'hotkey_registration_failed_id_1_win32_1409') { throw 'Precise hotkey failure missing' }
            if (@(Get-ChildItem $directory -Recurse -Filter 'input-*.json').Count -ne 0) { throw 'Startup probe must not enter an input action' }
            @{commit='${{ github.sha }}';passed=$true;ready_report=$true;visible_chinese_ready=$true;hotkey_conflict_reported=$true;input_actions=0;field_text_read=$false} | ConvertTo-Json | Set-Content dist/input-lab/runner-startup.json -Encoding utf8NoBOM
          } finally {
            foreach ($process in @($second, $first)) {
              if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }
      - name: Package lab and provenance
        shell: pwsh
        run: |
          Copy-Item scripts/windows-input-lab/Start-Input-Lab.cmd dist/input-lab/
          Copy-Item scripts/windows-input-lab/README.zh-CN.md dist/input-lab/
          Copy-Item LICENSE dist/input-lab/
          Remove-Item dist/input-lab/build.cmd, dist/input-lab/input-lab.obj
          $files = @{}
          Get-ChildItem dist/input-lab -File | ForEach-Object { $files[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          @{commit='${{ github.sha }}';run_id='${{ github.run_id }}';tool='synthetic Unicode input lab';signed=$false;desktop_acceptance='pending';files=$files} | ConvertTo-Json -Depth 5 | Set-Content dist/input-lab/lab-candidate.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vao-input-lab-x64-${{ github.sha }}
          path: |
            dist/input-lab/*.exe
            dist/input-lab/*.json
            dist/input-lab/*.cmd
            dist/input-lab/*.md
            dist/input-lab/LICENSE
          retention-days: 14
          if-no-files-found: warn
