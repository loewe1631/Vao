name: Windows UIA capabilities
on:
  push:
    branches: [codex/windows]
    paths:
      - scripts/windows-uia-capability/**
      - .github/workflows/windows-uia-capability.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-uia-capability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect-only:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python scripts/check-source.py
      - name: Compile read-only inspector and owned fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'MSVC installation unavailable' }
          $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvarsall.bat'
          New-Item -ItemType Directory -Force dist/capability | Out-Null
          $flags = '/nologo /std:c++17 /permissive- /W4 /WX /EHsc /O2 /MT /utf-8 /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /DVAO_CAP_COMMIT=\"${{ github.sha }}\"'
          $libraries = '/link user32.lib ole32.lib oleaut32.lib uiautomationcore.lib'
          @(
            ('call "' + $vcvars + '" x64'),
            ('cl ' + $flags + ' scripts/windows-uia-capability/capability.cpp /Fe:dist/capability/vao-uia-capability.exe /Fo:dist/capability/capability.obj ' + $libraries),
            'if errorlevel 1 exit /b 1',
            ('cl ' + $flags + ' scripts/windows-uia-capability/fixture-tests.cpp /Fe:dist/capability/owned-fixtures.exe /Fo:dist/capability/fixtures.obj ' + $libraries)
          ) | Set-Content dist/capability/build.cmd -Encoding ascii
          & cmd.exe /d /c dist\capability\build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Inspector compilation failed' }
      - name: Native read-only identity, ancestry, protection and timeout tests
        shell: pwsh
        run: |
          & ./dist/capability/vao-uia-capability.exe --build-info dist/capability/build-info.json
          if ($LASTEXITCODE -ne 0) { throw 'Inspector identity failed' }
          & ./dist/capability/owned-fixtures.exe "$PWD/dist/capability/vao-uia-capability.exe" "$PWD/dist/capability/runner-capability.json"
          if ($LASTEXITCODE -ne 0) { throw 'Owned native checks failed' }
          $report = Get-Content dist/capability/runner-capability.json -Raw | ConvertFrom-Json
          if (!$report.passed -or !$report.synthetic_fixture_only -or $report.commit -ne '${{ github.sha }}' -or $report.checks.Count -ne 15) { throw 'Unexpected native evidence' }
          if (@($report.checks | Where-Object { !$_.passed }).Count -ne 0) { throw 'Native assertion failed' }
      - name: Verify interactive readiness and hotkey conflict without inspecting a field
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $PWD 'dist/capability/startup-probe'
          $binary = Join-Path $PWD 'dist/capability/vao-uia-capability.exe'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $first = $null
          $second = $null
          try {
            $first = Start-Process $binary -ArgumentList @('--interactive', ('"' + $directory + '/first"')) -PassThru -RedirectStandardOutput "$directory/first.out" -RedirectStandardError "$directory/first.err"
            $ready = $false
            for ($attempt = 0; $attempt -lt 100; $attempt++) {
              if ($first.HasExited) { throw 'Inspector exited before ready' }
              if (Test-Path "$directory/first/ready.json") {
                $ready = (Get-Content "$directory/first/ready.json" -Raw | ConvertFrom-Json).status -eq 'ready'
              }
              if ($ready) { break }
              Start-Sleep -Milliseconds 100
            }
            if (!$ready -or (Get-Content "$directory/first.out" -Raw -Encoding utf8) -notmatch '已就绪') { throw 'Readiness unavailable' }
            $second = Start-Process $binary -ArgumentList @('--interactive', ('"' + $directory + '/second"')) -PassThru
            if (!$second.WaitForExit(10000) -or $second.ExitCode -ne 1) { throw 'Hotkey conflict must stop inspector' }
            if (@(Get-ChildItem $directory -Recurse -Filter 'capability-*.json').Count -ne 0) { throw 'Startup must not inspect fields' }
            @{commit='${{ github.sha }}';passed=$true;ready=$true;hotkey_conflict=$true;inspections=0;input_events=0;field_text_read=$false} | ConvertTo-Json | Set-Content dist/capability/runner-startup.json -Encoding utf8NoBOM
          } finally {
            foreach ($process in @($second,$first)) { if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force } }
          }
      - name: Package inspector and evidence
        shell: pwsh
        run: |
          Copy-Item scripts/windows-uia-capability/Start-Capability-Check.cmd, scripts/windows-uia-capability/README.zh-CN.md, LICENSE dist/capability/
          Remove-Item dist/capability/build.cmd, dist/capability/*.obj, dist/capability/owned-fixtures.exe
          $files = @{}
          Get-ChildItem dist/capability -File | ForEach-Object { $files[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          @{commit='${{ github.sha }}';run_id='${{ github.run_id }}';tool='read-only UIA capability probe';files=$files;signed=$false;desktop_acceptance='pending'} | ConvertTo-Json -Depth 5 | Set-Content dist/capability/capability-candidate.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vao-uia-capability-x64-${{ github.sha }}
          path: |
            dist/capability/*.exe
            dist/capability/*.json
            dist/capability/*.cmd
            dist/capability/*.md
            dist/capability/LICENSE
            dist/capability/fixture-reports/*.json
          retention-days: 14
          if-no-files-found: warn
