name: Windows candidate
on:
  push:
    branches: [codex/windows]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: python scripts/check-source.py
      - run: npm ci
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Windows x64 installer
        working-directory: desktop
        run: npx tauri build --target x86_64-pc-windows-msvc --config tauri.windows.conf.json --bundles nsis -- --locked
      - name: Collect candidate and provenance
        run: pwsh -File scripts/check-windows-startup.ps1
      - name: Package candidate and provenance
        run: python scripts/package-windows.py --commit ${{ github.sha }} --run-id ${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vao-windows-x64-${{ github.sha }}
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.json
            dist/windows/*.trace
            dist/windows/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed native probe metadata
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vao-windows-probes-${{ github.sha }}
          path: |
            dist/windows/*.json
            dist/windows/*.trace
          if-no-files-found: ignore
          retention-days: 7
