[package]
name = "vao-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
[[bin]]
name = "vao"
path = "src/main.rs"
[build-dependencies]
serde_json = "1"
cc = "1"
tauri-build = "=2.6.2"
[dependencies]
vao-core = { path = "../crates/vao-core" }
tauri = { version = "=2.11.2", features = ["macos-private-api", "tray-icon"] }
tauri-runtime = "=2.11.2"
tauri-runtime-wry = "=2.11.2"
tauri-macros = "=2.6.2"
tauri-utils = "=2.9.2"
tauri-plugin-single-instance = "2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
futures-util = "0.3"
getrandom = "0.3.4"
cpal = "0.15"
global-hotkey = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_HiDpi"] }
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
